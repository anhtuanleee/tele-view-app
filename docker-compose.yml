services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional: video tới 2GB. Bật bằng `docker compose --profile local up -d`
  # và đặt BOT_API_URL=http://telegram-bot-api:8081 trong .env
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  bot-api-data:
