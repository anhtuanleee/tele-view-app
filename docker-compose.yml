services:
  bot:
    build: .
    env_file: .env
    environment:
      - YT_POT_URL=http://bgutil-provider:4416
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - bgutil-provider

  # Tự động giải mã PO Token (BotGuard) cho yt-dlp để tải YouTube không cần cookie
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4416:4416"

  # Optional: video tới 2GB. Bật bằng `docker compose --profile local up -d`
  # và đặt BOT_API_URL=http://telegram-bot-api:8081 trong .env
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  bot-api-data:
